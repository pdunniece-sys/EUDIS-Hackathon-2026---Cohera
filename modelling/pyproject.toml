[project]
name = "tellus-magnav"
version = "0.1.0"
description = "Sample the Irish Tellus airborne magnetic anomaly grid along a flight path."
requires-python = ">=3.10"
dependencies = [
    "rasterio>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "xarray>=2023.1",
    "rioxarray>=0.15",
    "pyproj>=3.5",
    "matplotlib>=3.7",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyterlab>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
